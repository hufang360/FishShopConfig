<!DOCTYPE html>
<html lang="zh">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>物品查询</title>
	<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="css/style.css">
	<style>
		body {
			background-color: #549EE6;
		}

		.search-container {
			max-width: 1200px;
			margin: 50px auto;
			padding: 20px;
		}

		h2, h3, #resultCount, .no-results {
			color: white;
		}

		#searchInput {
			font-size: 1.1rem;
			color: white;
			background-color: rgba(255, 255, 255, 0.1);
			border-color: rgba(255, 255, 255, 0.5);
		}

		#searchInput::placeholder {
			color: rgba(255, 255, 255, 0.6);
		}

		#searchInput:focus {
			background-color: rgba(255, 255, 255, 0.15);
			border-color: rgba(255, 255, 255, 0.8);
			color: white;
			box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
		}

		#searchBtn, #clearBtn {
			border-color: rgba(255, 255, 255, 0.5);
			color: white;
		}

		#searchBtn, #clearBtn:hover {
			background-color: rgba(255, 255, 255, 0.2);
			border-color: rgba(255, 255, 255, 0.8);
		}

		#resultCount, #copyButtons {
			font-size: 0.9rem;
			margin-bottom: 10px;
		}

		#searchResults {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
			gap: 12px;
			background-color: transparent;
			border-color: rgba(255, 255, 255, 0.5) !important;
		}

		.result-item {
			border-radius: 6px;
			padding: 2px 0 10px 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 2px;
			cursor: pointer;
			transition: all 0.2s;
		}

		.result-item:hover {
			background-color: rgba(255, 255, 255, 0.1);
			border-color: rgba(255, 255, 255, 0.4);
			transform: translateY(-2px);
			/* box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); */
		}

		.item-icon {
			width: 72px;
			height: 72px;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}

		.item-id {
			color: white;
			font-size: 0.8rem;
			cursor: pointer;
			user-select: none;
			transition: color 0.2s;
		}

		.item-id:hover {
			color: rgba(255, 255, 255, 0.8);
			text-decoration: underline;
		}

		.item-name {
			text-align: center;
			font-size: 0.8rem;
			color: white;
			word-break: break-word;
			line-height: 1.3;
			max-height: 2.6em;
			overflow: hidden;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			cursor: pointer;
			transition: color 0.2s;
		}

		.item-name:hover {
			color: rgba(255, 255, 255, 0.8);
			text-decoration: underline;
		}

		.item-name.buff-name {
			cursor: default;
		}

		.item-name.buff-name:hover {
			color: white;
			text-decoration: none;
		}

		mark {
			background-color: rgba(255, 255, 255, 0.3);
			color: inherit;
			padding: 0;
		}

		.loading {
			text-align: center;
			padding: 20px;
			color: white;
		}

		.no-results {
			text-align: center;
			padding: 40px;
			white-space: nowrap;
		}

select.form-select {
	/* width: 140px; */
	/* max-width: 180px; */
	background-color: rgba(255, 255, 255, 0.1);
	border-color: rgba(255, 255, 255, 0.5);
	color: white;
	padding-right: 28px!important;
	background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='white' fill-rule='evenodd' d='M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e");
}
/* 搜索页面选择器样式 */
.search-select {
	width: 140px;
	max-width: 180px;
	background-color: rgba(255, 255, 255, 0.1);
	border-color: rgba(255, 255, 255, 0.5);
	color: white;
}

.toast-body {
	color: #333;
}

.a-white-muted {
	color: rgba(255, 255, 255, 0.8);
	text-decoration-line: none;
}

.a-white-muted:hover {
	color: white;
	text-decoration: underline;
	text-decoration-thickness: 2px;
	text-underline-offset: 4px;
	font-weight: bold;
}

/* 响应式：手机竖屏时 filterSelectsGroup 换行 */
@media (max-width: 768px) {
	.d-flex.mb-2.gap-2 {
		flex-wrap: wrap;
	}
	#filterSelectsGroup {
		width: 100%;
		flex-wrap: wrap;
	}
}
	</style>
</head>

<body>
	<div class="container search-container mt-1">
		<h3 class="mb-2">物品ID查询</h3>

		<!-- 搜索输入 -->
		<div class="input-group input-group-lg mb-2">
			<input type="text" class="form-control" id="searchInput" placeholder="输入物品名称或ID进行查询..." autocomplete="off">
			<button class="btn btn-outline-secondary" type="button" id="clearBtn" style="display: none;">&times;</button>
			<button class="btn btn-outline-secondary" type="button" id="searchBtn">搜索</button>
		</div>

		<div class="d-flex mb-2 gap-2">
		<!-- 类型选择 -->
		<div class="input-group">
			<select class="form-select search-select" id="searchType">
				<option value="item" selected>物品</option>
				<option value="buff">Buff</option>
			</select>
		</div>
		<!-- ID范围、集合、职业、水友选择 -->
		<div class="input-group input-group-sm" id="filterSelectsGroup">
			<select class="form-select" id="rangeSelect">
				<option value="">ID范围</option>
			</select>
			<select class="form-select search-select" id="collectionSelect">
				<option value="">集合</option>
			</select>
			<select class="form-select search-select" id="classSelect">
				<option value="">职业</option>
			</select>
			<select class="form-select search-select" id="friendSelect">
				<option value="">水友专属</option>
			</select>
		</div>
		<!-- Buff ID范围选择 -->
		<div class="input-group input-group-sm" id="buffRangeSelectGroup" style="display: none;">
			<select class="form-select search-select" id="buffRangeSelect">
				<option value="">Buff ID范围</option>
			</select>
		</div>
		</div>
		
		<!-- 结果数量 -->
		<div class="d-flex align-items-center mb-2">
			<div id="resultCount" class="mx-1"></div>
			<div id="copyButtons"  style="display: none;">
				<a href="#" class="a-white-muted mx-2" id="copyAll">复制</a>
				<a href="#" class="a-white-muted mx-2" id="copyIds">复制id</a>
				<a href="#" class="a-white-muted mx-2" id="copyNames">复制名字</a>
			</div>
		</div>

		<!-- 搜索结果 -->
		<div id="searchResults" class="">
			<div class="no-results">
			</div>
		</div>
	</div>

	<div class="container search-container">
		<div class="card-footer mx-2" style="text-indent: 2em;font-size: .75rem;color: rgba(255, 255, 255, 0.8)" id="versionText"></div>
		<div class="card-footer text-muted mx-2" style="font-size: .75rem;">
			<span style="color: rgba(255, 255, 255, 0.8)">参考连接：</span>
			<a href="https://terraria.wiki.gg/zh/wiki/%E7%89%A9%E5%93%81_ID" target="_blank" class="a-white-muted mx-1">物品_ID</a>
			<a href="https://terraria.wiki.gg/zh/wiki/NPC_ID" target="_blank" class="a-white-muted mx-1">NPC_ID</a>
			<a href="https://terraria.wiki.gg/zh/wiki/%E5%9B%BE%E6%A0%BC_ID" target="_blank" class="a-white-muted mx-1">图格_ID</a>
			<a href="https://terraria.wiki.gg/zh/wiki/%E6%95%B0%E6%8D%AE_ID" target="_blank" class="a-white-muted mx-1">数据_ID</a>
			<a href="https://terraria.wiki.gg/zh/wiki/Weapons" target="_blank" class="a-white-muted mx-1">武器</a>
			<a href="https://terraria.wiki.gg/zh/wiki/Cell_Phone" target="_blank" class="a-white-muted mx-1">手机</a>
			<a href="https://terraria.wiki.gg/zh/wiki/zenith" target="_blank" class="a-white-muted mx-1">天顶剑</a>
			<a href="https://terraria.wiki.gg/zh/wiki/Terraspark_Boots" target="_blank" class="a-white-muted mx-1">泰拉靴</a>
			<a href="https://terraria.wiki.gg/zh/wiki/Vanity_items" target="_blank" class="a-white-muted mx-1">时装</a>
			<a href="https://terraria.wiki.gg/zh/wiki/Upcoming_features" target="_blank" class="a-white-muted mx-1">1.4.5</a>
			<a href="https://steamcommunity.com/stats/105600/achievements" target="_blank" class="a-white-muted mx-1">所有成就</a>
		</div>
	</div>

	<!-- 提示消息 -->
	<div class="toast-container position-fixed bottom-0 end-0 p-3">
		<div id="copyToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="toast-body">
				已复制到剪贴板
			</div>
		</div>
	</div>

	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/data.js"></script>
	<script src="img/items.js"></script>
	<script src="js/search.js?0128"></script>
</body>

</html>
